<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Pet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    #pet-root {
      position: absolute;
      inset: 0;
    }
    #speech {
      position: absolute;
      left: 50%;
      top: 42px;
      transform: translateX(-50%) translateY(8px) scale(0.97);
      min-width: 170px;
      max-width: 268px;
      padding: 10px 11px 12px;
      border: 1px solid rgba(175, 208, 238, 0.58);
      border-radius: 24px;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.72), transparent 58%),
        linear-gradient(180deg, rgba(255, 252, 246, 0.95), rgba(243, 249, 255, 0.92));
      box-shadow:
        0 18px 40px rgba(109, 143, 180, 0.18),
        0 6px 16px rgba(153, 181, 207, 0.12);
      color: #4e6b86;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 220ms ease,
        transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 220ms ease,
        filter 220ms ease;
      backdrop-filter: blur(12px) saturate(1.03);
      filter: saturate(0.98);
    }
    #speech[data-tone="focus"] {
      border-color: rgba(164, 200, 236, 0.68);
      box-shadow:
        0 18px 40px rgba(118, 150, 185, 0.16),
        0 8px 18px rgba(164, 196, 226, 0.14);
    }
    #speech[data-tone="quiet"] {
      color: #6d8194;
      border-color: rgba(190, 212, 232, 0.62);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.62), transparent 58%),
        linear-gradient(180deg, rgba(252, 250, 245, 0.92), rgba(241, 246, 252, 0.88));
      filter: saturate(0.9);
    }
    #speech[data-tone="warm"] {
      color: #7d6575;
      border-color: rgba(239, 196, 212, 0.68);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.74), transparent 58%),
        linear-gradient(180deg, rgba(255, 248, 248, 0.96), rgba(255, 241, 245, 0.93));
      box-shadow:
        0 18px 40px rgba(186, 146, 169, 0.18),
        0 8px 18px rgba(234, 188, 206, 0.14);
    }
    #speech[data-tone="playful"] {
      color: #6f6a90;
      border-color: rgba(198, 190, 239, 0.78);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 58%),
        linear-gradient(180deg, rgba(251, 247, 255, 0.96), rgba(241, 241, 255, 0.93));
      box-shadow:
        0 18px 40px rgba(142, 136, 196, 0.18),
        0 8px 18px rgba(189, 181, 234, 0.16);
    }
    #speech.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      filter: saturate(1);
    }
    #speech::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 14px;
      height: 14px;
      transform: translateX(-50%) rotate(45deg);
      background: rgba(245, 249, 255, 0.96);
      border-right: 1px solid rgba(175, 208, 238, 0.58);
      border-bottom: 1px solid rgba(175, 208, 238, 0.58);
      border-bottom-right-radius: 3px;
    }
    #speech .speech-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #speech .speech-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: rgba(101, 136, 169, 0.92);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(181, 207, 229, 0.52);
    }
    #speech[data-tone="warm"] .speech-kicker {
      color: rgba(151, 104, 129, 0.92);
      box-shadow: inset 0 0 0 1px rgba(235, 190, 208, 0.56);
    }
    #speech[data-tone="playful"] .speech-kicker {
      color: rgba(117, 108, 169, 0.95);
      box-shadow: inset 0 0 0 1px rgba(197, 191, 238, 0.62);
    }
    #speech .speech-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.72;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.26);
    }
    #speech .speech-text {
      padding: 1px 6px 0;
      white-space: pre-wrap;
      text-wrap: pretty;
    }
    #speech .speech-ambient {
      width: 72px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(174, 209, 236, 0),
        rgba(174, 209, 236, 0.86),
        rgba(174, 209, 236, 0)
      );
      opacity: 0.7;
      transform-origin: center;
      animation: speech-breath 2.6s ease-in-out infinite;
    }
    #speech[data-tone="warm"] .speech-ambient {
      background: linear-gradient(
        90deg,
        rgba(234, 188, 206, 0),
        rgba(234, 188, 206, 0.86),
        rgba(234, 188, 206, 0)
      );
    }
    #speech[data-tone="playful"] .speech-ambient {
      background: linear-gradient(
        90deg,
        rgba(190, 182, 236, 0),
        rgba(190, 182, 236, 0.92),
        rgba(190, 182, 236, 0)
      );
    }
    @keyframes speech-breath {
      0%, 100% {
        opacity: 0.44;
        transform: scaleX(0.88);
      }
      50% {
        opacity: 0.84;
        transform: scaleX(1.05);
      }
    }
    #ctx {
      position: absolute;
      display: none;
      min-width: 190px;
      padding: 6px;
      border: 1px solid rgba(206, 196, 240, 0.2);
      border-radius: 16px;
      background: rgba(19, 17, 29, 0.95);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 40px rgba(5, 5, 13, 0.36);
      z-index: 20;
    }
    #ctx.show {
      display: block;
    }
    #ctx .i {
      padding: 10px 14px;
      border-radius: 10px;
      color: #e9e1f4;
      font-size: 13px;
      cursor: pointer;
      transition: background 120ms ease;
    }
    #ctx .i:hover {
      background: rgba(167, 151, 209, 0.14);
    }
    #ctx .d {
      height: 1px;
      margin: 5px 8px;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="pet-root"></div>
  <div id="speech"></div>
  <div id="ctx"></div>
  <script type="module" src="/src/pet-main.ts"></script>
</body>
</html>
